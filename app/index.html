<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0c" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="《黎明杀机》中文速查工具：角色、技能、配件与效果搜索。个人自用，非官方。"
    />
    <!-- 数值是站内的重要内容（「32 米」「30 秒」），关掉 iOS 的自动电话号码识别，
         否则个别数字串会被识别成 tel: 链接并染成蓝色 -->
    <meta name="format-detection" content="telephone=no" />
    <meta name="robots" content="noindex, nofollow" />

    <title>迷雾工具箱</title>

    <!-- 图标：现代浏览器用矢量，其余走 PNG。
         带 <link rel="icon"> 后浏览器就不会再去请求 /favicon.ico，避免 404 -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- 添加到主屏后以全屏 Web App 运行；black-translucent 让内容延伸到状态栏下方，
         配合 CSS 里的 env(safe-area-inset-*) 才不会被刘海压住 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="迷雾" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- ============================================================
         首屏加载态（DBD 对局载入的观感）
         —— 全部内联，不依赖任何外部请求，所以它在 HTML 一到就出现：
            JS/CSS 还没下载完、owners.json 还没回来时，用户看到的是这段动画，
            而不是白屏（html 底色也在这里先铺成深色，避免白闪）。
            数据到齐后由 src/lib/splash.ts 给 #splash 加 .is-gone 淡出并移除。

         主体是 DBD 那个「计数划痕」标记：四条竖线 + 一条斜线（纯白，和游戏 logo 一致）。
         五条依次被「划」上去 —— stroke-dashoffset 从 1 收到 0，笔画沿着
         自己的走向生长（竖线由下往上，斜线由左下往右上）；
         划完短暂停留 → 整组淡出 → 从第一条重新开始。
         为了不出现「数据回得太快、动画被拦腰截断」，splash.ts 会保证它
         至少完整播完一轮（见下面的 __splashT0）。
         背后是两层各自漂移的雾（径向渐变 + transform 缓动）。
         动画只用 transform / opacity / stroke-dashoffset，不用任何滤镜 ——
         iOS Safari 上滤镜会渲染异常。
         ============================================================ -->
    <script>
      /* 首屏加载态开始的时间点。splash.ts 用它算「已经播了多久」，
         保证至少完整播完一个循环才退场（HTML 解析到这里就开始计时，
         比 JS 包执行要早，所以比在模块里取 performance.now() 更准）。 */
      window.__splashT0 = performance.now();
    </script>
    <style>
      html {
        background: #060608;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 20px;
        background: #060608;
        transition: opacity 0.32s ease;
      }
      #splash.is-gone {
        opacity: 0;
        pointer-events: none;
      }
      #splash > * {
        position: relative;
        z-index: 1;
      }

      /* ---------- 雾：两层反向缓动，重叠处看着像雾在流动 ---------- */
      .sp-fog {
        position: absolute;
        inset: -20%;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 34% 26% at 30% 40%, rgba(179, 32, 32, 0.17), transparent 70%),
          radial-gradient(ellipse 30% 22% at 72% 62%, rgba(232, 226, 214, 0.06), transparent 70%);
        animation: sp-fog-a 26s ease-in-out infinite alternate;
      }
      .sp-fog::after {
        content: '';
        position: absolute;
        inset: 0;
        background:
          radial-gradient(ellipse 40% 30% at 62% 34%, rgba(179, 32, 32, 0.14), transparent 72%),
          radial-gradient(ellipse 26% 20% at 26% 70%, rgba(232, 226, 214, 0.05), transparent 72%);
        animation: sp-fog-b 34s ease-in-out infinite alternate;
      }
      @keyframes sp-fog-a {
        from {
          transform: translate3d(-3%, 2%, 0) scale(1);
        }
        to {
          transform: translate3d(3%, -2%, 0) scale(1.08);
        }
      }
      @keyframes sp-fog-b {
        from {
          transform: translate3d(2%, -3%, 0) scale(1.06);
        }
        to {
          transform: translate3d(-2%, 3%, 0) scale(1);
        }
      }

      /* ---------- 计数划痕：四条竖线 + 一条斜线 ----------
         按游戏那个标记的比例来（四条竖血痕 = 四个逃生者，一条斜痕 = 屠夫）：
           · 整体接近正方形（viewBox 100×100，画满约 97×89）
           · 四条竖线细而高，x 间距 21、线宽 7（间隙 14 —— 四条之间留得比较开）
           · 中间两根比左右两根长，但只长一点点（不是共用一条基线）：
             左右 y 14→88（长 74），中间 y 10→92（长 82），两端各差 4
           · 斜线**从左上划到右下**，约 20° 的浅角度横穿四条，两端探出得比较远
             （几乎顶到画布两侧），最后才划
         viewBox 100×100：竖线 x = 19 / 40 / 61 / 82；斜线 (5,34) → (95,67)，
         dy/dx = 33/90 → 20.1°，落点从左竖线的上部 y≈39 到右竖线的下部 y≈62。
         每条 path 上都写了 pathLength="1"，把自身长度归一化 ——
         这样 dasharray / dashoffset 统一用 1 就够了，五条线的「生长速度」
         与长短无关，不会出现斜线先画完、竖线还在半路的情况。 */
      .sp-tally {
        width: 112px;
        height: 112px;
        overflow: visible;
        /* 划完 → 停留 → 整体淡出 → 回到起点重画，所以淡出挂在整组上 */
        animation: sp-tally-cycle 2.4s linear infinite both;
      }
      .sp-tally path {
        fill: none;
        stroke: #e8e2d6;
        stroke-width: 7;
        stroke-linecap: butt;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation-duration: 2.4s;
        animation-timing-function: cubic-bezier(0.32, 0.06, 0.28, 1);
        animation-iteration-count: infinite;
        animation-fill-mode: both;
      }
      .sp-tally path:nth-child(1) {
        animation-name: sp-line-1;
      }
      .sp-tally path:nth-child(2) {
        animation-name: sp-line-2;
      }
      .sp-tally path:nth-child(3) {
        animation-name: sp-line-3;
      }
      .sp-tally path:nth-child(4) {
        animation-name: sp-line-4;
      }
      .sp-tally path:nth-child(5) {
        animation-name: sp-line-5;
      }
      /* 五条各自的时间窗（都按 2.4s 一轮算）：
         0→13 / 8→21 / 16→29 / 24→37 / 32→45 %；
         每条划 0.31s、彼此错开 0.19s，所以看到的是「一笔接一笔」。
         45% 之后全部保持画好，94% 之后整组已经淡出，100% 复位重来。 */
      @keyframes sp-line-1 {
        0% {
          stroke-dashoffset: 1;
        }
        13%,
        94% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: 1;
        }
      }
      @keyframes sp-line-2 {
        0%,
        8% {
          stroke-dashoffset: 1;
        }
        21%,
        94% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: 1;
        }
      }
      @keyframes sp-line-3 {
        0%,
        16% {
          stroke-dashoffset: 1;
        }
        29%,
        94% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: 1;
        }
      }
      @keyframes sp-line-4 {
        0%,
        24% {
          stroke-dashoffset: 1;
        }
        37%,
        94% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: 1;
        }
      }
      @keyframes sp-line-5 {
        0%,
        32% {
          stroke-dashoffset: 1;
        }
        45%,
        94% {
          stroke-dashoffset: 0;
        }
        100% {
          stroke-dashoffset: 1;
        }
      }
      @keyframes sp-tally-cycle {
        0%,
        86% {
          opacity: 1;
        }
        93%,
        100% {
          opacity: 0;
        }
      }

      /* 系统开了「减少动效」：动画全停，但标记要**直接画满** ——
         否则停在 dashoffset: 1 上就什么都看不见了 */
      @media (prefers-reduced-motion: reduce) {
        #splash *,
        #splash *::after {
          animation: none !important;
        }
        .sp-tally {
          opacity: 1 !important;
        }
        .sp-tally path {
          stroke-dashoffset: 0 !important;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" role="status" aria-live="polite" aria-label="正在载入">
      <div class="sp-fog"></div>
      <svg class="sp-tally" viewBox="0 0 100 100" aria-hidden="true">
        <path d="M19 88V14" pathLength="1" />
        <path d="M40 92V10" pathLength="1" />
        <path d="M61 92V10" pathLength="1" />
        <path d="M82 88V14" pathLength="1" />
        <path d="M5 34L95 67" pathLength="1" />
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
